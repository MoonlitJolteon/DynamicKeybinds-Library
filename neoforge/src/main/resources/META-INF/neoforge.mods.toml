modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "dynamickeybinds"
version = "${version}"
displayName = "Dynamic Keybinds"
authors = "Moonlit Productions"
description = '''
DynamicKeybinds lets mods create, sync, and persist custom runtime keybinds tied to the world, not the client.
'''

[[mixins]]
config = "dynamickeybinds-common.mixins.json"

[[dependencies.dynamickeybinds]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.dynamickeybinds]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"
